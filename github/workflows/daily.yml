name: daily-bellhaven-sync

on:
  schedule:
    - cron: "0 13 * * *"   # 1pm UTC daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Scrape website
        run: python scraper/scrape_bellhaven.py

      - name: Pull CRM accounts
        run: python crm/pull_accounts.py
        env:
          CRM_API_TOKEN: ${{ secrets.CRM_API_TOKEN }}

      - name: Run matcher
        run: python matcher/match.py

      - name: Generate proposals
        run: python pipeline/generate_proposals.py

      - uses: actions/upload-artifact@v4
        with:
          name: decisions-db
          path: data/decisions.db
