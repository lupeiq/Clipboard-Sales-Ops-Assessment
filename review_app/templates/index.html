<!DOCTYPE html>
<html>
<head>
    <title>Bellhaven CRM Review</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .action { font-weight: bold; color: #333; }
        pre { background: #f5f5f5; padding: 8px; border-radius: 4px; overflow-x: auto; }
        button { padding: 6px 16px; margin-right: 8px; border: none; border-radius: 4px; cursor: pointer; }
        .approve { background: #2e7d32; color: white; }
        .reject { background: #c62828; color: white; }
    </style>
</head>
<body>
    <h1>Pending Proposals ({{ proposals|length }})</h1>

    {% for p in proposals %}
    <div class="card">
        <div class="action">{{ p.action }} — account {{ p.account_id or "(new)" }}</div>
        <p><strong>Payload:</strong></p>
        <pre>{{ p.payload | tojson(indent=2) }}</pre>
        <p><strong>Evidence:</strong></p>
        <pre>{{ p.evidence | tojson(indent=2) }}</pre>

        <form method="POST" action="{{ url_for('approve', proposal_id=p.proposal_id) }}" style="display:inline">
            <button class="approve" type="submit">Approve</button>
        </form>
        <form method="POST" action="{{ url_for('reject', proposal_id=p.proposal_id) }}" style="display:inline">
            <button class="reject" type="submit">Reject</button>
        </form>
    </div>
    {% else %}
    <p>No pending proposals.</p>
    {% endfor %}
</body>
</html>
